function analysis(S){const arr=Object.entries(S.tp).map(([k,v])=>[k,Math.round(v[0]/v[1]*100),v[0],v[1]]).sort((a,b)=>b[1]-a[1]);
 let weak=arr.filter(x=>x[1]<70).reverse().slice(0,3);if(!weak.length&&arr.length&&arr[arr.length-1][1]<100)weak=[arr[arr.length-1]];
 const strong=arr.filter(x=>x[1]>=80&&!weak.includes(x)).slice(0,3);S.weak=weak.map(x=>x[0]);
 const miss=k=>S.qs.map((q,i)=>({q,a:S.ans[i]})).filter(x=>x.q.topic==k&&x.a!==x.q.a).slice(0,2);
 const f=x=>x.map(y=>y[0]+" "+y[1]+"%").join(", ");
 return `<h3 style="margin-top:20px">Topic breakdown</h3><div class="card">${arr.map(([k,p,c,n])=>`<div style="margin:8px 0"><div class="row" style="margin:0"><span>${k}</span><span class="sp mute">${c}/${n} · ${p}%</span></div><div class="bar"><i style="width:${p}%;background:${p<70?"var(--bad)":"var(--acc)"}"></i></div></div>`).join("")}</div>
<div class="grid" style="margin-top:14px"><div class="card"><b>Strongest topics</b><br>${f(strong)||"–"}</div><div class="card"><b>Weakest topics</b><br>${f(weak)||"None – well done"}</div></div>
${weak.length?`<h3 style="margin-top:20px">What to review</h3><div class="card">${weak.map(([k,p,c,n])=>`<p><b>${k}</b> (${c}/${n} correct) – review ${LEC[k]}.<br><span class="mute">${miss(k).map(m=>"Missed: “"+esc(m.q.t.slice(0,70))+"” → "+inl(m.q.ex)).join("<br>")}</span></p>`).join("")}<button class="p" onclick="startRev(S.weak)">Start a 12-question revision quiz</button></div>`:""}`}
function mkRev(topics,used,skip){const r=rng(Date.now()%100000);let c=ALLQ.filter(q=>topics.includes(q.topic)&&!skip.has(kq(q))&&!used.has(kq(q)));
 if(c.length<12)c=c.concat(ALLQ.filter(q=>topics.includes(q.topic)&&!skip.has(kq(q))&&used.has(kq(q))));
 c=shuf(c,r).slice(0,12);if(c.length<10)c=c.concat(shuf(ALLQ.filter(q=>!topics.includes(q.topic)&&!skip.has(kq(q))),r).slice(0,10-c.length));
 return shuf(c,r).map(q=>{const k=q.o[0],o=shuf(q.o,r);return{...q,o,a:o.indexOf(k)}})}
function startRev(topics,skip,used){skip=skip||new Set(S.qs.map(kq));used=used||new Set();const qs=mkRev(topics,used,skip);qs.forEach(q=>used.add(kq(q)));S={v:"quiz",n:0,rev:1,mode:"practice",qs,ans:Array(qs.length).fill(null),i:0,chk:{},used,topics,skip};render()}
function again(){startRev(S.topics,S.skip,S.used)}
function theme(t,sv){document.documentElement.dataset.theme=t;const b=document.getElementById("th");b.textContent=t=="dark"?"☀ Light":"☾ Dark";if(sv)try{localStorage.setItem("pep_theme",t)}catch(e){}}
(()=>{let t=null;try{t=localStorage.getItem("pep_theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";theme(t,false);document.getElementById("th").onclick=()=>theme(document.documentElement.dataset.theme=="dark"?"light":"dark",true)})();

const KEY="pep_results_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
let S={v:"home"};const $a=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const L="abcde";
// ---- code display helpers (presentation only; question data is never modified)
const KW=new Set("int double float char bool void if else for while do switch case default break continue return struct typedef new delete const unsigned signed short long using namespace true false nullptr NULL string sizeof cout cin endl".split(" "));
function hl(c){return String(c).replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#\s*include[^\n]*)|(\b\d+(?:\.\d+)?f?\b)|([A-Za-z_]\w*)|(<<|>>|->|::|\+\+|--|&&|\|\||[<>=!+\-*\/%&|^]=?|[?:])|([\s\S])/g,
 (m,cm,st,pp,nu,id,op)=>cm?`<span class="hc">${esc(m)}</span>`:st?`<span class="hs">${esc(m)}</span>`:pp?`<span class="hp">${esc(m)}</span>`:nu?`<span class="hn">${m}</span>`:id?(KW.has(m)?`<span class="hk">${m}</span>`:m):op?`<span class="ho">${esc(m)}</span>`:esc(m))}
// re-flow a one-line snippet into indented lines (used only for the verbatim exam, whose code is stored on one line)
function fmt(src){let out=[],cur="",ind=0,par=0,ini=0,q=null,prev="";
 const flush=()=>{if(cur.trim())out.push("    ".repeat(ind)+cur.trim());cur=""};
 for(let i=0;i<src.length;i++){const ch=src[i];
  if(q){cur+=ch;if(ch=="\\"){cur+=src[++i]||""}else if(ch==q)q=null;continue}
  if(ch=='"'||ch=="'"){q=ch;cur+=ch;continue}
  if(ch=="(")par++;if(ch==")")par--;
  if(ch=="{"){const nx=src.slice(i+1).trim()[0];if(ini>0||prev=="="){ini++;cur+=ch}else{cur=cur.replace(/\s+$/,"")+" {";flush();ind++}}
  else if(ch=="}"){if(ini>0){ini--;cur+=ch}else{flush();ind=Math.max(0,ind-1);cur="}";if(src.slice(i+1).trim()[0]==";"){cur+=";";i=src.indexOf(";",i)}flush()}}
  else if(ch==";"&&par==0&&ini==0){cur+=";";flush()}
  else cur+=ch;
  if(ch.trim())prev=ch}
 flush();return out.join("\n")}
function cblock(code){return code?`<div class="cb"><div class="cbh"><span>C++</span><button type="button" class="cpy" onclick="copyCode(this)">Copy code</button></div><pre tabindex="0"><code>${hl(code)}</code></pre></div>`:""}
function copyCode(b){const t=b.closest(".cb").querySelector("code").textContent;const done=()=>{b.textContent="Copied!";setTimeout(()=>b.textContent="Copy code",1500)};
 const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
const IC=/\b\w+::\w+|\b\w+\([^()]*\)|\b\w+(?:\[[^\]]*\])+|\b\w+->\w+|'\\0'|\bnullptr\b|\bNULL\b/g;
function inl(s){s=String(s);let o="",l=0;s.replace(IC,(m,i)=>{o+=esc(s.slice(l,i))+`<code class="ic">${hl(m)}</code>`;l=i+m.length;return m});return o+esc(s.slice(l))}
function isCode(o){return /;\s*$/.test(o)||/^(?:->|::|\*|&|\. \(dot\))$/.test(o)||/^[\w.\[\]()*&]+(?:\s+(?:==|<<|>>|&&|[%\/*+\-<>=])\s+[\w.\[\]()*&]+)+$/.test(o)}
const opt=o=>isCode(o)?`<code class="ic">${hl(o)}</code>`:inl(o);
function parts(q){if(q.code)return{pre:q.t,code:q.code,post:""};
 if(q.orig){let m=q.t.match(/^(What is the output of the code:|How many asterisks will the code print:)\s*(.+)$/);if(m)return{pre:m[1],code:fmt(m[2]),post:""};
  m=q.t.match(/^(Given:)\s*(.+;)\s*(Which .+)$/);if(m)return{pre:m[1],code:fmt(m[2]),post:m[3]}}
 return{pre:q.t,code:"",post:""}}

function ask(m,y){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9";d.innerHTML=`<div class="card" style="max-width:380px"><p>${m}</p><div class="row"><button class="s" id="mn">Cancel</button><button class="p sp" id="my">Confirm</button></div></div>`;document.body.appendChild(d);d.querySelector("#mn").onclick=()=>d.remove();d.querySelector("#my").onclick=()=>{d.remove();y()}}
function go(v){S.v=v;render();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(S.v=="quiz")ask("Leave this test? Your answers will be lost.",()=>go(v));else go(v)});
function stats(){const R=load(),n=new Set(R.map(r=>r.test)).size,sc=R.map(r=>r.score/r.total*100);return{R,n,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b)/sc.length):null,best:sc.length?Math.round(Math.max(...sc)):null}}
function start(n,mode){const T=TESTS[n-1];S={v:"quiz",n,mode,qs:T.qs,ans:Array(T.qs.length).fill(null),i:0,chk:{}};render()}
function finish(){if(S.done)return;S.done=true;const q=S.qs;let c=0,w=0,u=0;const tp={};q.forEach((x,i)=>{const a=S.ans[i];tp[x.topic]=tp[x.topic]||[0,0];tp[x.topic][1]++;if(a===null)u++;else if(a===x.a){c++;tp[x.topic][0]++}else w++});
 const R=load();if(!S.rev)R.push({test:S.n,mode:S.mode,score:c,total:q.length,date:new Date().toISOString(),tp});if(!S.rev)save(R);S={...S,v:"res",c,w,u,tp,filter:"all"};render()}

function render(){window.scrollTo(0,0);({home,tests,prog,quiz,res}[S.v]||home)()}
function home(){const s=stats();$a.innerHTML=`<h1>Programming Exam Preparation</h1><p class="mute" style="max-width:60ch">Practice C++ multiple-choice questions on vectors, strings, structs, pointers, dynamic memory, functions and loops — the topics from your sample exams. Use Exam Mode to simulate the real test, or Practice Mode to learn as you go.</p>
<div class="grid" style="margin:18px 0"><div class="card"><div class="stat">${TESTS.length}</div><div class="mute">practice tests</div></div><div class="card"><div class="stat">${TESTS.reduce((a,t)=>a+t.qs.length,0)}</div><div class="mute">questions</div></div><div class="card"><div class="stat">${s.n}/${TESTS.length}</div><div class="mute">tests completed</div></div><div class="card"><div class="stat">${s.avg===null?"–":s.avg+"%"}</div><div class="mute">average score</div></div><div class="card"><div class="stat">${s.best===null?"–":s.best+"%"}</div><div class="mute">best score</div></div></div>
<button class="p" onclick="go('tests')">Start practicing</button>`}
function tests(){const R=load();$a.innerHTML=`<h2>Practice tests</h2><div class="grid">${TESTS.map(t=>{const rs=R.filter(r=>r.test==t.n),b=rs.length?Math.max(...rs.map(r=>r.score)):null;return`<div class="card"><h3>${t.title}</h3><div class="mute">${t.qs.length} questions${t.orig?" · exact original wording and order":""}</div><p class="mute">${b===null?"Not attempted yet":`Completed ${rs.length}× · best ${b}/${t.qs.length}`}</p><div class="row"><button class="p" onclick="start(${t.n},'exam')">Exam mode</button><button class="s" onclick="start(${t.n},'practice')">Practice mode</button></div></div>`}).join("")}</div>`}
function quiz(){const q=S.qs[S.i],P=parts(q),i=S.i,pm=S.mode=="practice",ck=pm&&S.chk[i],a=S.ans[i];
 $a.innerHTML=`<div class="row" style="margin:0 0 10px"><b>${S.rev?"Revision quiz":S.n==4?"Original exam":"Test "+S.n} · ${pm?"Practice":"Exam"} mode</b><span class="sp mute">Question ${i+1} of ${S.qs.length} · ${S.ans.filter(x=>x!==null).length} answered</span></div><div class="bar" style="margin-bottom:14px"><i style="width:${(i+1)/S.qs.length*100}%"></i></div>
<div class="nav">${S.qs.map((_,k)=>`<button class="${S.ans[k]!==null?"done":""} ${k==i?"cur":""}" onclick="S.i=${k};render()">${k+1}</button>`).join("")}</div>
<div class="card"><span class="tag">${q.topic}</span><span class="tag">${{E:"Easy",M:"Medium",H:"Hard"}[q.diff]}</span><h3 style="margin-top:10px">${inl(P.pre)}</h3>${cblock(P.code)}${P.post?`<p style="margin:8px 0 0">${inl(P.post)}</p>`:""}
${q.o.map((o,k)=>`<button class="opt ${a===k?"sel":""} ${ck?(k==q.a?"ok":a===k?"no":""):""}" onclick="pick(${k})"><b>${L[k]}.</b> ${opt(o)}</button>`).join("")}
${ck?`<div class="ex"><b>${a===q.a?"Correct.":a===null?"No answer selected.":"Incorrect."}</b> Answer: ${L[q.a]}. ${inl(q.ex)}</div>`:""}
<div class="row"><button class="s" ${i?"":"disabled"} onclick="S.i--;render()">Previous</button><button class="s" ${i<S.qs.length-1?"":"disabled"} onclick="S.i++;render()">Next</button>${pm?`<button class="s" onclick="S.chk[${i}]=1;render()">Check answer</button>`:""}${a!==null?`<button class="s" onclick="S.ans[${i}]=null;render()">Clear</button>`:""}<button class="p sp" onclick="submit()">Submit test</button></div></div>`}

function res(){const p=Math.round(S.c/S.qs.length*100),qs=S.qs;
 const list=qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>S.filter=="all"||x.a!==x.q.a);
 $a.innerHTML=`<h2>${S.rev?"Revision quiz":S.n==4?"Original exam":"Test "+S.n} results</h2><div class="card row" style="gap:24px"><div class="ring" style="background:conic-gradient(var(--acc) ${p*3.6}deg,var(--line) 0)"><span>${p}%</span></div><div><div class="stat">${S.c} / ${S.qs.length}</div><div class="mute">${S.c} correct · ${S.w} incorrect · ${S.u} unanswered</div></div></div>

${list.length?"":`<p class="card" style="margin-top:14px">No mistakes — every question was answered correctly.</p>`}
${list.map(({q,i,a},_,__,P=parts(q))=>`<div class="card rq ${a===null?"u":a===q.a?"r":"w"}"><span class="tag">${q.topic}</span><b>${i+1}. ${inl(P.pre)}</b>${cblock(P.code)}${P.post?`<p style="margin:8px 0 0">${inl(P.post)}</p>`:""}<div>Your answer: ${a===null?"<i>not answered</i>":L[a]+". "+opt(q.o[a])}</div><div>Correct answer: <b>${L[q.a]}. ${opt(q.o[q.a])}</b></div><div class="ex">${inl(q.ex)}</div></div>`).join("")}`}

<div class="row"><button class="s" onclick="ask('Delete all saved results?',()=>{save([]);prog()})">Reset progress</button></div>`:`<div class="card">No results yet. Finish a test and your scores and weak topics will appear here.<div class="row"><button class="p" onclick="go('tests')">Choose a test</button></div></div>`}`}
